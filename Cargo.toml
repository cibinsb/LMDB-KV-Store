[package]
name = "lmdb_kv_store"
version = "0.1.0"
edition = "2021"
authors = ["Cibin <cibin345@gmail.com>"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = "0.7.5"
charabia = "0.7.2"
lazy_static = "1.4.0"
fst = "0.4.7"
heed = "0.11.0"
rand = "0.8"
base64 = "0.13"
serde = "1.0.164"
serde_json = "1.0.97"
tokio = { version = "1.0", features = ["full"] }
tower = { version = "0.4.13", features = ["util", "timeout", "load-shed", "limit"] }
tower-http = { version = "0.5.2", features = [
    "add-extension",
    "auth",
    "compression-full",
    "limit",
    "trace",
] }
tower-layer = "0.3.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
shuttle-axum = "0.47.0"
shuttle-runtime = "0.47.0"

[dev-dependencies]
hyper = "1.4.1"
axum-test = "15.6.0"
http = "1.1.0"
